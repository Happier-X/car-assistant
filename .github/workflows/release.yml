name: Release

# 推送 v* 标签时自动构建 release APK 并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore
        # 本项目 release 用 debug keystore 签名（保证车机上覆盖升级），
        # CI 上没有 ~/.android/debug.keystore，从 Secrets 解码到相同路径
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Restore debug keystore
        # 本项目 release 用 debug keystore 签名（保证车机上覆盖升级），
        # CI 上没有 ~/.android/debug.keystore，从 Secrets 解码到相同路径
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Extract version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             car-assistant-${{ steps.ver.outputs.VERSION }}.apk

      - name: Read release notes
        id: notes
        run: |
          # 从 CHANGELOG.md 提取当前版本段落；没有 CHANGELOG 时用标签信息
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$(echo "${{ steps.ver.outputs.VERSION }}" | sed 's/\./\\./g")' '
              $0 ~ "^## \\[?"ver"?\\]?" {flag=1; next}
              /^## / {flag=0}
              flag
            ' CHANGELOG.md > body.md
          fi
          if [ ! -s body.md ]; then
            echo "车机助手 ${{ steps.ver.outputs.VERSION }}" > body.md
            echo "" >> body.md
            echo "完整变更见 commit 历史。" >> body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 车机助手 ${{ github.ref_name }}
          body_path: body.md
          files: car-assistant-${{ steps.ver.outputs.VERSION }}.apk
          generate_release_notes: true
