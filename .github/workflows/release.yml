name: Release

# 推送 v* 标签时自动构建 release APK 并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore
        # 本项目 release 用 debug keystore 签名（保证车机上覆盖升级），
        # CI 上没有 ~/.android/debug.keystore，从 Secrets 解码到相同路径
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64'; exit 1; }
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          EXPECTED=7b946b6579869e69bbfb814748c7a400acfae8a0f480f44d8ad5de81e8085d6c
          ACTUAL=$(keytool -exportcert -alias androiddebugkey -keystore ~/.android/debug.keystore -storepass android | sha256sum | cut -d ' ' -f 1)
          test "$ACTUAL" = "$EXPECTED" || { echo 'Signing certificate mismatch; release stopped'; exit 1; }

      - name: Check tag version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Fq "versionName = \"$VERSION\"" app/build.gradle.kts

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Extract version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             car-assistant-${{ steps.ver.outputs.VERSION }}.apk

      - name: Read release notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            # 提取包含版本号的 "## " 段落直到下一个 "## " 标题
            awk -v ver="$VER" '
              /^## / {
                if (found) exit
                if (index($0, ver) > 0) { found = 1; next }
                next
              }
              found { print }
            ' CHANGELOG.md > body.md
          fi
          if [ ! -s body.md ]; then
            printf '车机助手 %s\n\n完整变更见 commit 历史。\n' "$VER" > body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 车机助手 ${{ github.ref_name }}
          body_path: body.md
          files: car-assistant-${{ steps.ver.outputs.VERSION }}.apk
          generate_release_notes: true
